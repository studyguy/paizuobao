<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席位卡打印 · 排座宝</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #e8e2d6; }
  .bar {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 18px; background: #3a3026; color: #f5e9d0;
    position: sticky; top: 0; z-index: 9;
  }
  .bar b { font-size: 15px; }
  .bar span { font-size: 12.5px; opacity: .8; }
  .bar button {
    margin-left: auto; padding: 8px 18px; font-size: 14px; font-weight: bold;
    border: none; border-radius: 8px; background: #d4a017; color: #fff; cursor: pointer;
  }
  .sheets { padding: 16px; }
  .sheet {
    width: 210mm; min-height: 291mm; margin: 0 auto 14px;
    background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.18);
    display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 68mm;
  }
  .card {
    border: 1px dashed #c9bfae;
    margin: -0.5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; position: relative;
    background: linear-gradient(180deg, #fffdf8 0%, #fdf6e8 100%);
  }
  .card::before, .card::after {
    content: '囍'; position: absolute; font-size: 15px; color: #d4a017; opacity: .5;
  }
  .card::before { top: 5px; left: 8px; }
  .card::after { bottom: 5px; right: 8px; }
  .ev { font-size: 10px; color: #b8860b; letter-spacing: 3px; margin-bottom: 6px; }
  .name { font-size: 30px; font-weight: bold; color: #3a3026; letter-spacing: 2px; }
  .role { font-size: 12px; color: #9a8f77; margin-top: 4px; }
  .tbl {
    margin-top: 12px; padding: 3px 16px;
    border: 1.5px solid #c2543a; border-radius: 99px;
    font-size: 14px; font-weight: bold; color: #c2543a;
  }
  .diet { font-size: 10.5px; color: #a16207; margin-top: 4px; }
  .empty { padding: 40px; color: #8a7a5c; }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheets { padding: 0; }
    .sheet { width: auto; min-height: 0; height: 290mm; margin: 0; box-shadow: none; page-break-after: always; }
    .card { border-color: #bbb; }
  }
  @page { size: A4 portrait; margin: 9mm; }
</style>
</head>
<body>
  <div class="bar">
    <b>席位卡</b><span id="meta">加载中…</span>
    <button onclick="window.print()">🖨️ 打印 / 存为 PDF</button>
  </div>
  <div class="sheets" id="sheets"></div>

<script>
/* 角色标签表（与 js/data.js 同步的只读副本，供本页独立运行）
 * 必须在主脚本前定义：render 在首个脚本的微任务里执行 */
window.PaizuoROLES = {
  groom: { label: '新郎' }, bride: { label: '新娘' },
  groomFather: { label: '新郎父亲' }, groomMother: { label: '新郎母亲' },
  brideFather: { label: '新娘父亲' }, brideMother: { label: '新娘母亲' },
  grandparent: { label: '祖辈' }, witness: { label: '证婚人' }, uncle: { label: '舅父' },
  elder: { label: '长辈' }, leader: { label: '领导' }, relative: { label: '亲属' },
  colleague: { label: '同事' }, classmate: { label: '同学' }, friend: { label: '朋友' },
  other: { label: '其他' },
  boss: { label: '董事长' }, seniorExec: { label: '总裁/副总裁' }, vipGuest: { label: '特邀嘉宾' },
  exec: { label: '总监' }, manager: { label: '经理' }, supervisor: { label: '主管' },
  staff: { label: '员工' }, plusOne: { label: '家属' },
};
(function () {
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);

  async function getState() {
    const e = q.get('e');
    if (e) {
      const res = await fetch('/api/events/' + e);
      if (!res.ok) throw new Error('活动不存在');
      const ev = await res.json();
      return ev.state;
    }
    const raw = localStorage.getItem('paizuo_state_v1');
    return raw ? JSON.parse(raw) : null;
  }

  function render(state) {
    const seats = state.plan && state.plan.seats || {};
    const seated = (state.guests || []).filter(g => g.attending !== false && seats[g.id]);
    seated.sort((a, b) => {
      const sa = seats[a.id], sb = seats[b.id];
      const ta = state.tables.findIndex(t => t.id === sa.t), tb = state.tables.findIndex(t => t.id === sb.t);
      return (ta - tb) || (sa.s - sb.s);
    });
    $('meta').textContent = (state.meta.eventName || '') + ' · ' + seated.length + ' 张卡 · 8 张/页';
    if (!seated.length) {
      $('sheets').innerHTML = '<p class="empty">还没有已入座的宾客——回主界面完成排座后再来打印。</p>';
      return;
    }
    const ROLES = window.PaizuoROLES;
    const perPage = 8;
    const pages = [];
    for (let i = 0; i < seated.length; i += perPage) pages.push(seated.slice(i, i + perPage));
    $('sheets').innerHTML = pages.map(page =>
      '<div class="sheet">' + page.map(g => {
        const s = seats[g.id];
        const t = state.tables.find(x => x.id === s.t);
        const role = ROLES[g.role] ? ROLES[g.role].label : '';
        return '<div class="card">' +
          '<div class="ev">' + (state.meta.eventName || '席位卡') + '</div>' +
          '<div class="name">' + g.name + '</div>' +
          (role ? '<div class="role">' + role + '</div>' : '') +
          '<div class="tbl">' + (t && t.isHead ? '★ ' : '') + (t ? t.name : '') + ' · ' + (s.s + 1) + '号位</div>' +
          (g.dietary ? '<div class="diet">餐饮：' + g.dietary + '</div>' : '') +
          '</div>';
      }).join('') + '</div>'
    ).join('');
    if (q.get('auto') === '1') setTimeout(() => window.print(), 400);
  }

  getState().then(render).catch(e => {
    $('meta').textContent = '加载失败';
    $('sheets').innerHTML = '<p class="empty">' + e.message + '（分享打印需运行 serve.py）</p>';
  });
})();
</script>
</body>
</html>
